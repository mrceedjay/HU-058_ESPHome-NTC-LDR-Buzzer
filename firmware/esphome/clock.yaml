substitutions:
  name: wifi-clock
  friendly_name: WiFi Clock

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(panel)->set_effect_speed(id(effect_speed).state);
          id(panel)->set_effect_angle(id(effect_angle).state);
          id(panel)->set_effect_hue_span(id(effect_hue_span).state);
          id(panel)->set_flash_fade(id(fx_flash_fade).state);
          std::string sp = id(effect_spread).current_option();
          id(panel)->set_effect_spread(sp == "Per Digit" ? 1 : sp == "Per LED" ? 2 : 0);
          std::string ef = id(effect_mode).current_option();
          id(panel)->set_effect(ef == "Color Cycle" ? 1 : ef == "Flash" ? 2 : 0);

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: components

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

  actions:
    - action: show_seconds
      variables:
        duration: int
      then:
        - lambda: id(panel)->show_seconds(duration);

    - action: show_number
      variables:
        value: int
        unit: string
        duration: int
      then:
        - lambda: id(panel)->show_number(value, unit, duration);

    - action: lamp_test
      variables:
        duration: int
      then:
        - lambda: id(panel)->lamp_test(duration);

    - action: set_digit_color
      variables:
        digit: int
        red: int
        green: int
        blue: int
      then:
        - lambda: |-
            id(panel)->set_digit_color(
              digit,
              red / 255.0f,
              green / 255.0f,
              blue / 255.0f
            );

    - action: clear_digit_colors
      then:
        - lambda: id(panel)->clear_digit_colors();

    - action: set_position_color
      variables:
        position: int
        red: int
        green: int
        blue: int
      then:
        - lambda: |-
            id(panel)->set_position_color(
              position,
              red / 255.0f,
              green / 255.0f,
              blue / 255.0f
            );

    - action: set_effect
      variables:
        mode: int
        spread: int
        speed: float
        angle: float
        hue_span: float
        flash_fade: float
      then:
        - lambda: |-
            id(effect_speed).make_call()
              .set_value(clamp(speed, 0.2f, 600.0f)).perform();

            id(effect_angle).make_call()
              .set_value(clamp(angle, -180.0f, 180.0f)).perform();

            id(effect_hue_span).make_call()
              .set_value(clamp(hue_span, 0.0f, 360.0f)).perform();

            id(fx_flash_fade).make_call()
              .set_value(clamp(flash_fade, 0.0f, 30.0f)).perform();

            id(effect_spread).make_call().set_option(
              spread == 1 ? "Per Digit" :
              spread == 2 ? "Per LED" :
              "Whole Panel"
            ).perform();

            id(effect_mode).make_call().set_option(
              mode == 1 ? "Color Cycle" :
              mode == 2 ? "Flash" :
              "None"
            ).perform();

    - action: set_gradient
      variables:
        red1: int
        green1: int
        blue1: int
        red2: int
        green2: int
        blue2: int
        angle: float
      then:
        - lambda: |-
            id(panel)->set_gradient(
              red1 / 255.0f,
              green1 / 255.0f,
              blue1 / 255.0f,
              red2 / 255.0f,
              green2 / 255.0f,
              blue2 / 255.0f,
              angle
            );

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: ${friendly_name} Setup
    password: !secret ap_password

  on_connect:
    - lambda: id(panel)->set_online(true);

  on_disconnect:
    - lambda: id(panel)->set_online(false);

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

  - platform: sntp
    id: sntp_time
    timezone: !secret timezone

aip33628:
  id: panel
  clk_pin: GPIO22
  data_pin: GPIO21
  clk2_pin: GPIO19
  data2_pin: GPIO18
  time_id: ha_time
  twelve_hour: false
  blink_colon: true
  max_current: 15

light:
  - platform: aip33628
    id: display
    aip33628_id: panel
    name: Display
    restore_mode: RESTORE_DEFAULT_ON
    gamma_correct: 1.0

sensor:
  # NTC
  #
  # 3.3V
  #   |
  #  10k
  #   |
  # GPIO34
  #   |
  #  NTC
  #   |
  #  GND

  - platform: adc
    pin: GPIO34
    id: ntc_adc
    attenuation: auto
    update_interval: 5s

  - platform: resistance
    sensor: ntc_adc
    id: ntc_resistance
    configuration: DOWNSTREAM
    resistor: 10kOhm
    reference_voltage: 3.3V

  - platform: ntc
    sensor: ntc_resistance
    id: temperature
    name: Temperature
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    accuracy_decimals: 1

  # Light sensor
  #
  # MCU socket pin 4 / RP
  # GPIO35
  #
  # Inverted:
  # 0V = 100%
  # 3.3V = 0%

  - platform: adc
    pin: GPIO35
    id: light_sensor
    name: Light
    attenuation: auto
    update_interval: 5s
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 0.0 -> 100.0
            - 3.3 -> 0.0
      - clamp:
          min_value: 0.0
          max_value: 100.0

binary_sensor:
  - platform: gpio
    id: button_1
    name: Button 1
    pin:
      number: GPIO32
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

  - platform: gpio
    id: button_2
    name: Button 2
    pin:
      number: GPIO33
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

script:
  - id: buzzer_beep
    mode: restart
    then:
      - output.turn_on: buzzer_output
      - output.ledc.set_frequency:
          id: buzzer_output
          frequency: !lambda "return id(buzzer_frequency).state;"
      - output.set_level:
          id: buzzer_output
          level: !lambda "return id(buzzer_volume).state / 200.0f;"
      - delay: !lambda "return (uint32_t) id(buzzer_duration).state;"
      - output.turn_off: buzzer_output

switch:
  - platform: template
    id: twelve_hour_mode
    name: 12 Hour Time
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(panel)->set_twelve_hour(true);
    turn_off_action:
      - lambda: id(panel)->set_twelve_hour(false);

  - platform: template
    id: colon_blink
    name: Blink Colon
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(panel)->set_blink_colon(true);
    turn_off_action:
      - lambda: id(panel)->set_blink_colon(false);

# BUZZER
#
# GPIO25 -> 10k -> PNP base
# PNP emitter -> 3.3V
# PNP collector -> buzzer -> GND
#
# PNP is active LOW, therefore the ESPHome output is inverted.
#
# Buzzer Volume:
#   0%   = 0% PWM
#   50%  = 25% PWM
#   100% = 50% PWM

output:
  - platform: ledc
    pin: GPIO25
    id: buzzer_output
    frequency: 2000 Hz
    inverted: true

button:
  - platform: template
    name: Buzzer Beep
    icon: mdi:volume-high
    on_press:
      - script.execute: buzzer_beep

  - platform: template
    name: Lamp Test
    on_press:
      - lambda: id(panel)->lamp_test(3000);

  - platform: template
    name: Show Seconds
    on_press:
      - lambda: id(panel)->show_seconds(5000);

  - platform: template
    name: Digit Color Demo
    on_press:
      - lambda: |-
          id(panel)->set_digit_color(0, 1.00f, 0.00f, 0.00f);
          id(panel)->set_digit_color(1, 1.00f, 0.45f, 0.00f);
          id(panel)->set_digit_color(2, 0.00f, 1.00f, 0.25f);
          id(panel)->set_digit_color(3, 0.10f, 0.30f, 1.00f);

  - platform: template
    name: Clear Digit Colors
    on_press:
      - lambda: id(panel)->clear_digit_colors();

  - platform: template
    name: Diagonal Gradient
    on_press:
      - lambda: |-
          id(panel)->set_gradient(
            0.00f, 1.00f, 0.10f,
            1.00f, 0.85f, 0.00f,
            -45.0f
          );

select:
  - platform: template
    name: Effect
    id: effect_mode
    optimistic: true
    restore_value: true
    initial_option: "None"
    options:
      - "None"
      - "Color Cycle"
      - "Flash"
    set_action:
      - lambda: |-
          std::string v = x;
          id(panel)->set_effect(
            v == "Color Cycle" ? 1 :
            v == "Flash" ? 2 :
            0
          );

  - platform: template
    name: Effect Spread
    id: effect_spread
    optimistic: true
    restore_value: true
    initial_option: "Whole Panel"
    options:
      - "Whole Panel"
      - "Per Digit"
      - "Per LED"
    set_action:
      - lambda: |-
          std::string v = x;
          id(panel)->set_effect_spread(
            v == "Per Digit" ? 1 :
            v == "Per LED" ? 2 :
            0
          );

  - platform: template
    name: Test Unit
    id: test_unit
    optimistic: true
    restore_value: true
    initial_option: "F"
    options:
      - "None"
      - "F"
      - "C"
    set_action:
      - lambda: |-
          std::string u = x;
          if (u == "None")
            u.clear();

          id(panel)->show_number(
            (int) id(test_number).state,
            u,
            10000
          );

number:
  - platform: template
    name: Buzzer Duration
    id: buzzer_duration
    optimistic: true
    restore_value: true
    initial_value: 100
    min_value: 1
    max_value: 10000
    step: 1
    unit_of_measurement: ms
    mode: box

  - platform: template
    name: Buzzer Frequency
    id: buzzer_frequency
    optimistic: true
    restore_value: true
    initial_value: 2000
    min_value: 100
    max_value: 10000
    step: 1
    unit_of_measurement: Hz
    mode: box

  - platform: template
    name: Buzzer Volume
    id: buzzer_volume
    optimistic: true
    restore_value: true
    initial_value: 20
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider

  - platform: template
    name: Effect Speed
    id: effect_speed
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 0.2
    max_value: 600
    step: 0.2
    unit_of_measurement: s
    mode: box
    set_action:
      - lambda: id(panel)->set_effect_speed(x);

  - platform: template
    name: Effect Angle
    id: effect_angle
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -180
    max_value: 180
    step: 15
    unit_of_measurement: deg
    mode: box
    set_action:
      - lambda: id(panel)->set_effect_angle(x);

  - platform: template
    name: Effect Hue Span
    id: effect_hue_span
    optimistic: true
    restore_value: true
    initial_value: 90
    min_value: 0
    max_value: 360
    step: 5
    unit_of_measurement: deg
    mode: box
    set_action:
      - lambda: id(panel)->set_effect_hue_span(x);

  - platform: template
    name: Flash Fade
    id: fx_flash_fade
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 30
    step: 0.05
    unit_of_measurement: s
    mode: box
    set_action:
      - lambda: id(panel)->set_flash_fade(x);

  - platform: template
    name: Test Number
    id: test_number
    optimistic: true
    restore_value: true
    initial_value: 72
    min_value: -999
    max_value: 9999
    step: 1
    mode: box
    set_action:
      - lambda: |-
          std::string u = id(test_unit).current_option();

          if (u == "None")
            u.clear();

          id(panel)->show_number(
            (int) x,
            u,
            10000
          );
